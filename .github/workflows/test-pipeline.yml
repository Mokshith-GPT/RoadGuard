name: RoadGuard CVIP & Backend Test Suite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Run Python CVIP & Model Service Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install fastapi uvicorn httpx

      - name: Verify CVIP 5-Module Pipeline
        run: |
          python test_pipeline.py

      - name: Verify Model Service Inference Adapter
        run: |
          python test_model_service.py

      - name: Verify CCTV & IP Camera Adapter
        run: |
          python cctv_adapter.py --test-mock
