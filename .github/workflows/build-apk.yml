name: Build RoadGuard Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          chmod +x android/gradlew || true

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          # Use system gradle or wrapper
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          else
            gradle assembleRelease || gradle assembleDebug
          fi

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          cp "$APK_PATH" RoadGuard-v1.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoadGuard-v1.0-APK
          path: RoadGuard-v1.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "RoadGuard v1.0.0 - Android Mobile App"
          body: |
            ### 🛣️ RoadGuard Android Mobile Application (.apk)

            * **Supported Android Versions:** Android 8.0 (Oreo, API 26) through Android 14/15 (API 34/35)
            * **License:** Apache License 2.0
            * **Target SDK:** 34 (Google Play Protect Compliant)
            * **Features:**
              - Real-time Dashcam Camera Viewfinder
              - Live Telemetry HUD Banner (Damage Area % & Defect Counts)
              - On-device Severity Indexing (Low 🟢, Medium 🟡, High 🔴)
              - Automated Road Audit Snapshot Logging
          files: RoadGuard-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
