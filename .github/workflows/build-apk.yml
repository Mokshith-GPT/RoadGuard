name: Build RoadGuard Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Package APK
        run: |
          APK_FILE="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_FILE" ]; then
            echo "Release APK not found."
            exit 1
          fi
          cp "$APK_FILE" RoadGuard-v1.1.apk
          ls -lh RoadGuard-v1.1.apk

      - name: Publish versioned GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "RoadGuard v1.1.0 — Android Dashcam Demo"
          draft: false
          prerelease: false
          body: |
            ## RoadGuard Android v1.1.0

            ### Included
            - CameraX rear-camera preview.
            - Manual MP4 dashcam recording in five-minute segments.
            - Rolling retention of the two newest completed video clips in app-specific storage.
            - Manual evidence-frame capture with a JSON metadata sidecar.
            - Beige, red and green RoadGuard interface palette.

            ### Important limitations
            - This APK does not include trained YOLO inference or automatic pothole detection.
            - Recording is stopped when the camera Activity leaves the foreground.
            - Evidence is stored locally by the app; it is not synchronized to the PWA album.
            - This build uses the debug signing configuration for sideload/demo testing. Do not use it for Play Store publishing.
            - For model inference, Google sign-in and civic email integration, configure the web/API deployment described in DEPLOYMENT.md.

            See DEPLOYMENT.md for deployment and security configuration.
          files: RoadGuard-v1.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
