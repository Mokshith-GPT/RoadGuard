name: Build RoadGuard Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper & Build APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Find and Package APK
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" RoadGuard-v1.0.apk
          ls -lh RoadGuard-v1.0.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "RoadGuard v1.0.0 (Android Mobile APK)"
          draft: false
          prerelease: false
          body: |
            ## 🛣️ RoadGuard Android Mobile Application

            **Direct APK Download for Android Devices**

            ### 📱 Compatibility & Security
            * **Supported Android Versions:** Android 8.0 (Oreo, API 26) through Android 15 (API 34/35)
            * **Target SDK:** 34 (Google Play Store & Play Protect Compliant)
            * **License:** Apache License 2.0
            * **Package Name:** `com.mokshith.roadguard`

            ### 🚀 Features Included
            * Real-time Camera Preview with Telemetry HUD Viewfinder
            * Pothole (`D40`) & Crack (`D00`, `D10`, `D20`) Severity Indexing
            * Metric surface area ratio calculation ($A_d = \frac{N_d}{N_r} \times 100$)
            * On-device defect logging and snapshot audit
            
            ---
            ### 📥 Download & Install
            Click on **`RoadGuard-v1.0.apk`** under the **Assets** section below to download directly to your Android device.
          files: RoadGuard-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
